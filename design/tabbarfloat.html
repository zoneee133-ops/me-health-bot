<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Me — Float TabBar</title>
<style>
  :root{
    --bg-outer:#E8E9EB; --bg:#F4F5F6; --surface:#FFFFFF; --surface-soft:#F8F9FA;
    --ink:#111110; --ink-2:#6B6B68; --ink-3:#A3A3A0;
    --accent:#004D56; --accent-dark:#003840; --accent-soft:#E8F1F3;
    --radius-m:16px;
    --spring:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg-outer);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Helvetica,Arial,sans-serif;
    color:var(--ink); display:flex; justify-content:center; align-items:flex-start; padding:24px 12px 40px;
  }
  .device{
    width:390px; max-width:100%; height:844px; max-height:92vh;
    background:var(--bg); border-radius:44px; border:1px solid #D8D6D1;
    overflow:hidden; position:relative; box-shadow:0 40px 80px -40px rgba(0,0,0,0.28);
    display:flex; flex-direction:column;
  }
  .statusbar{ display:flex; justify-content:space-between; align-items:center;
    padding:14px 26px 6px; font-size:14px; font-weight:600; flex-shrink:0; }
  .stage{ flex:1; position:relative; overflow:hidden; }
  .stage-head{ padding:22px 24px 0; }
  .stage-head h1{ font-size:29px; font-weight:700; letter-spacing:-0.02em; margin:8px 0 2px; }
  .stage-head p{ font-size:15px; color:var(--ink-2); margin:0; }
  .stage-name{ position:absolute; left:24px; bottom:130px; font-size:13px; color:var(--ink-3); }

  /* ===== Float tab bar ===== */
  .floatnav{
    position:absolute; left:16px; right:16px;
    bottom:calc(env(safe-area-inset-bottom,0) + 14px);
    height:62px; border-radius:31px;
    background:rgba(255,255,255,0.82);
    backdrop-filter:blur(24px) saturate(1.5);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    box-shadow:0 8px 32px -8px rgba(20,20,18,0.16), 0 2px 8px rgba(20,20,18,0.06),
               inset 0 0 0 1px rgba(255,255,255,0.6);
    display:flex; align-items:center; z-index:10;
    transform:translateY(140%);
    animation:navIn 0.62s var(--spring) 0.2s forwards;
  }
  @keyframes navIn{ to{ transform:translateY(0); } }

  .fn-blob{
    position:absolute; top:9px; left:0; width:44px; height:44px;
    border-radius:22px; background:var(--accent-soft);
    pointer-events:none; z-index:0;
    transform:scale(0);
    animation:blobIn 0.34s var(--spring) 0.46s forwards;
  }
  @keyframes blobIn{ to{ transform:scale(1); } }

  .fn-tab{
    position:relative; z-index:1; flex:1; height:100%;
    display:flex; align-items:center; justify-content:center; gap:0;
    background:none; border:none; cursor:pointer; padding:0;
    color:var(--ink-3);
    transition:color 0.24s ease 0.06s;
  }
  .fn-tab:active{ transform:scale(0.9); transition:transform 0.12s var(--spring); }
  .fn-tab svg{ width:24px; height:24px; flex-shrink:0;
    transition:transform 0.24s var(--spring) 0.06s; }
  .fn-tab.active{ color:var(--accent); }
  .fn-tab.active svg{ transform:scale(1.06) translateY(-1px); }
  .fn-label{
    font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden;
    max-width:0; opacity:0; margin-left:0;
    transition:max-width 0.2s var(--spring) 0.12s, opacity 0.18s ease 0.12s, margin-left 0.2s var(--spring) 0.12s;
  }
  .fn-tab.active .fn-label{ max-width:64px; opacity:1; margin-left:6px; }
  .fn-tab:not(.active) .fn-label{ transition:max-width 0.08s ease, opacity 0.08s ease, margin-left 0.08s ease; }

  /* ===== contextual accent action ===== */
  .fn-action{
    position:absolute; left:8px; top:-16px;
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(180deg, var(--accent) 0%, var(--accent-dark) 100%);
    border:none; cursor:pointer; z-index:12;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    box-shadow:0 6px 16px -4px rgba(15,76,92,0.45);
    transform:translateY(140%) scale(0.6);
    animation:actionIn 0.55s var(--spring) 0.3s forwards;
  }
  @keyframes actionIn{ to{ transform:translateY(0) scale(1); } }
  .fn-action:active{ transform:scale(0.9); transition:transform 0.12s var(--spring); }
  .fn-action svg{ width:20px; height:20px; }
  .fn-action.hidden{
    transform:scale(0.6); opacity:0; pointer-events:none;
    transition:transform 0.22s var(--spring), opacity 0.22s var(--spring);
    animation:none;
  }

  @media (prefers-reduced-motion: reduce){
    .floatnav,.fn-blob,.fn-action{ animation:none; transform:none; }
    .fn-blob{ transform:scale(1); }
    .fn-tab,.fn-tab svg,.fn-label{ transition-duration:0.12s; transition-delay:0s; }
  }
</style>
</head>
<body>

<div class="device">
  <div class="statusbar"><span>9:41</span><span>Me</span></div>

  <div class="stage">
    <div class="stage-head">
      <h1 id="stageTitle">Сегодня</h1>
      <p id="stageSub">Ваше здоровье сегодня</p>
    </div>
    <div class="stage-name" id="stageName">screen-today</div>

    <nav class="floatnav" id="floatnav">
      <span class="fn-blob" id="fnBlob"></span>

      <button class="fn-tab active" data-nav="today" data-label="Сегодня">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-4.35-9.5-8.8C.7 8.7 2 5 5.4 4.4 7.7 4 9.8 5 12 7.3 14.2 5 16.3 4 18.6 4.4 22 5 23.3 8.7 21.5 12.2 19 16.65 12 21 12 21z"/></svg>
        <span class="fn-label">Сегодня</span>
      </button>

      <button class="fn-tab" data-nav="health" data-label="Здоровье">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span class="fn-label">Здоровье</span>
      </button>

      <button class="fn-tab" data-nav="meds" data-label="Лекарства">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6M12 9v6"/></svg>
        <span class="fn-label">Лекарства</span>
      </button>

      <button class="fn-tab" data-nav="ask" data-label="Ask Me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
        <span class="fn-label">Ask Me</span>
      </button>

      <button class="fn-tab" data-nav="profile" data-label="Профиль">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span class="fn-label">Профиль</span>
      </button>

      <button class="fn-action" id="fnAction" aria-label="Действие">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
  </div>
</div>

<script>
(function(){
  var nav = document.getElementById('floatnav');
  var blob = document.getElementById('fnBlob');
  var action = document.getElementById('fnAction');
  var tabs = Array.prototype.slice.call(nav.querySelectorAll('.fn-tab'));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // per-screen contextual action: [icon paths, screen title, screen subtitle]
  var SCREENS = {
    today:   { icon:'M12 5v14M5 12h14',           title:'Сегодня',    sub:'Ваше здоровье сегодня' },
    health:  { icon:'M12 5v14M5 12h14',           title:'Мое здоровье', sub:'Все данные в одном месте' },
    meds:    { icon:'M4 4h16v16H4zM9 12h6M12 9v6', title:'Лекарства',  sub:'Расписание приёма' },
    ask:     { icon:'M12 19c-4 0-7-3-7-7V8a3 3 0 016 0v4M12 19a3 3 0 003-3M12 19v3', title:'Спросите Me', sub:'Отвечаю по вашим данным' },
    profile: { icon:null,                          title:'Профиль',    sub:'Настройки и подключения' }
  };

  function slot(){ return nav.clientWidth / tabs.length; }

  function moveBlob(index, animate){
    var s = slot();
    var to = s * index + (s - 44) / 2;
    if (!animate || reduce){ blob.style.transform = 'translateX(' + to + 'px)'; return; }
    var from = blob.style.transform || 'translateX(' + to + 'px)';
    var fx = parseFloat((from.match(/translateX\(([-\d.]+)/) || [0, to])[1]);
    var mid = (fx + to) / 2;
    blob.animate([
      { transform:'translateX(' + fx + 'px) scaleX(1)' },
      { transform:'translateX(' + mid + 'px) scaleX(1.4)', offset:0.5 },
      { transform:'translateX(' + to + 'px) scaleX(1)' }
    ], { duration:440, easing:'cubic-bezier(.32,.72,0,1)' });
    blob.style.transform = 'translateX(' + to + 'px)';
  }

  function setAction(name){
    var cfg = SCREENS[name];
    if (!cfg.icon){ action.classList.add('hidden'); return; }
    var wasHidden = action.classList.contains('hidden');
    action.classList.remove('hidden');
    var svg = action.querySelector('svg');
    var swap = function(){ svg.innerHTML = '<path d="' + cfg.icon + '"/>'; };
    if (reduce || wasHidden){ swap(); return; }
    svg.animate([{opacity:1,transform:'rotate(0)'},{opacity:0,transform:'rotate(-90deg)'}],{duration:120,fill:'forwards'})
      .onfinish = function(){ swap(); svg.animate([{opacity:0,transform:'rotate(90deg)'},{opacity:1,transform:'rotate(0)'}],{duration:140,fill:'forwards'}); };
  }

  function go(name){
    var index = tabs.findIndex(function(t){ return t.dataset.nav === name; });
    if (index < 0) return;
    tabs.forEach(function(t,i){ t.classList.toggle('active', i === index); });
    moveBlob(index, true);
    setAction(name);
    document.getElementById('stageTitle').textContent = SCREENS[name].title;
    document.getElementById('stageSub').textContent = SCREENS[name].sub;
    document.getElementById('stageName').textContent = 'screen-' + name;
    if (navigator.vibrate) navigator.vibrate(8);
  }

  tabs.forEach(function(t){ t.addEventListener('click', function(){ go(t.dataset.nav); }); });
  action.addEventListener('click', function(){
    var active = tabs.find(function(t){ return t.classList.contains('active'); });
    console.log('action:', active && active.dataset.nav);
  });

  // initial position (no animation; CSS keyframe handles blob scale-in)
  moveBlob(0, false);
  addEventListener('resize', function(){
    var i = tabs.findIndex(function(t){ return t.classList.contains('active'); });
    moveBlob(Math.max(0,i), false);
  });
})();
</script>
</body>
</html>
