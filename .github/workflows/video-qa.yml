name: Video QA Gate

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Run QA gate against pending reels
        env:
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -e
          if [ -z "$WEBAPP_URL" ] || [ -z "$ADMIN_KEY" ]; then
            echo "WEBAPP_URL or ADMIN_KEY secret not set — skipping run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LOG="VIDEO-QA-LOG.md"
          [ -f "$LOG" ] || echo "# Video QA Log" > "$LOG"
          echo "" >> "$LOG"
          echo "## $(date -u +%Y-%m-%dT%H:%M:%SZ) — GitHub Actions run" >> "$LOG"

          items=$(curl -sf -H "X-Admin-Key: $ADMIN_KEY" "$WEBAPP_URL/api/queue?status=pending&kind=reel")
          if ! echo "$items" | jq -e '.items' >/dev/null 2>&1; then
            echo "- queue response was not valid JSON, aborting this run" >> "$LOG"
            cat "$LOG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(echo "$items" | jq '.items | length')
          echo "- pending reels: $count" >> "$LOG"

          echo "$items" | jq -c '.items[]' | while read -r item; do
            id=$(echo "$item" | jq -r '.id')
            vurl=$(echo "$item" | jq -r '.payload.video_url // empty')
            if [ -z "$vurl" ]; then
              echo "- $id: no video_url in payload, skipped (status unchanged)" >> "$LOG"
              continue
            fi

            tmp="/tmp/$id.mp4"
            if ! curl -sf -o "$tmp" "$vurl" </dev/null; then
              echo "- $id: video failed to download, skipped (status unchanged)" >> "$LOG"
              continue
            fi

            probe=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -show_entries format=duration -of json "$tmp" </dev/null 2>/dev/null)
            width=$(echo "$probe" | jq -r '.streams[0].width // 0' 2>/dev/null); [[ "$width" =~ ^[0-9]+$ ]] || width=0
            height=$(echo "$probe" | jq -r '.streams[0].height // 0' 2>/dev/null); [[ "$height" =~ ^[0-9]+$ ]] || height=0
            duration=$(echo "$probe" | jq -r '.format.duration // 0' 2>/dev/null | cut -d. -f1); [[ "$duration" =~ ^[0-9]+$ ]] || duration=0
            has_audio=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$tmp" </dev/null 2>/dev/null)
            maxvol=$(ffmpeg -nostdin -i "$tmp" -af volumedetect -f null - </dev/null 2>&1 | grep -oP 'max_volume:\s*-?\K[0-9.]+' | head -1)
            [[ "$maxvol" =~ ^[0-9.]+$ ]] || maxvol=""

            reasons=""
            if [ "$width" -eq 0 ] || [ "$height" -eq 0 ]; then reasons="$reasons could not read video (corrupt/undownloadable);"; fi
            [ -z "$has_audio" ] && reasons="$reasons no audio track;"
            if [ -n "$maxvol" ] && awk "BEGIN{exit !($maxvol > 50)}"; then reasons="$reasons audio too quiet (max_volume -${maxvol}dB);"; fi
            if [ "$width" -gt 0 ] && [ "$height" -gt 0 ] && [ "$width" -ge "$height" ]; then reasons="$reasons not vertical (${width}x${height});"; fi
            if [ "$duration" -lt 3 ] || [ "$duration" -gt 90 ]; then reasons="$reasons bad duration (${duration}s);"; fi

            rm -f "$tmp"

            if [ -z "$reasons" ]; then
              code=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST "$WEBAPP_URL/api/queue-decide" \
                -H "X-Admin-Key: $ADMIN_KEY" -H "Content-Type: application/json" \
                -d "{\"id\":\"$id\",\"verdict\":\"approved\"}")
              if [ "$code" = "429" ]; then
                echo "- $id: passed QA, daily cap reached — left pending" >> "$LOG"
              elif [ "$code" = "200" ]; then
                echo "- $id: passed QA, approved" >> "$LOG"
              else
                echo "- $id: passed QA, but decide call failed (HTTP $code)" >> "$LOG"
              fi
            else
              curl -s -o /dev/null -X POST "$WEBAPP_URL/api/queue-decide" \
                -H "X-Admin-Key: $ADMIN_KEY" -H "Content-Type: application/json" \
                -d "{\"id\":\"$id\",\"verdict\":\"rejected\",\"reason\":\"$reasons\"}"
              echo "- $id: rejected — $reasons" >> "$LOG"
            fi
          done

          cat "$LOG" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VIDEO-QA-LOG.md
          git diff --cached --quiet && exit 0
          git commit -m "qa: video lint — $(date -u +%Y-%m-%d)"
          git push
