# Cron-воркер: раз в 15 минут дёргает /api/tick на Pages, который рассылает
# напоминания о приёме лекарств. Публичного роута нет (workers.dev в РФ заблокирован,
# но cron работает внутри Cloudflare и это не мешает).
#
# Деплой:  cd worker && wrangler deploy

name = "me-cron"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crontab = ["*/15 * * * *"]

[vars]
TICK_URL = "https://me-webapp.pages.dev/api/tick"
TICK_KEY = "tk_9f3d1a7c42e8"
