# Cron-воркер: раз в 15 минут дёргает /api/tick на Pages (рассылка напоминаний).
# Публичного роута нет. Секрет:  wrangler secret put TICK_KEY   (или через дашборд воркера).
# Деплой:  cd worker && wrangler deploy

name = "me-cron"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["*/15 * * * *"]

[vars]
TICK_URL = "https://me-webapp.pages.dev/api/tick"
